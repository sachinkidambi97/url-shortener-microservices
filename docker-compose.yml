services:
  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - url-shortener-net

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - url-shortener-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: url-shortener-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - url-shortener-net

  shortening-api:
    build:
      context: .
      dockerfile: src/ShorteningApi/UrlShortener.ShorteningApi/Dockerfile
    container_name: url-shortener-shortening-api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=shortening_db;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SecretKey: "change-me-in-production-must-be-at-least-32-chars"
      Jwt__Issuer: "UrlShortener"
      Jwt__Audience: "UrlShortener"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - url-shortener-net

  redirect-service:
    build:
      context: .
      dockerfile: src/RedirectService/UrlShortener.RedirectService/Dockerfile
    container_name: url-shortener-redirect-service
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=shortening_db;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - url-shortener-net

  analytics-service:
    build:
      context: .
      dockerfile: src/AnalyticsService/UrlShortener.AnalyticsService/Dockerfile
    container_name: url-shortener-analytics-service
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=analytics_db;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"
      Jwt__SecretKey: "change-me-in-production-must-be-at-least-32-chars"
      Jwt__Issuer: "UrlShortener"
      Jwt__Audience: "UrlShortener"
      ShorteningApi__BaseUrl: "http://shortening-api:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - url-shortener-net

volumes:
  postgres-data:

networks:
  url-shortener-net:
    driver: bridge
